<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión · Pollería</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; }
      main { max-width: 420px; padding: 24px; text-align: center; }
      h1 { font-size: 1.5rem; }
      li { text-align: left; margin: 6px 0; }
      button { margin-top: 16px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: #c2410c; color: white; font-size: 1rem; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 3rem">🔌</div>
      <h1>No hay conexión con el servidor del local</h1>
      <p>Los pedidos no se pierden: el servidor los guarda cuando vuelve la conexión.</p>
      <ul>
        <li>Revisa que este equipo esté en el WiFi del local.</li>
        <li>Revisa que la computadora del servidor esté encendida.</li>
        <li>Si el router se reinició, espera un minuto.</li>
      </ul>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>

    <clipPath id="scr"><rect x="12" y="12" width="316" height="696" rx="32"/></clipPath>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.18"/></filter>

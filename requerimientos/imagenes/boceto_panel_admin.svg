      .rkv { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .lg { font-size: 12px; fill: #334155; }
      .al { font-size: 12.5px; font-weight: 600; }
    </style>
    <clipPath id="scr"><rect width="1160" height="664" rx="0"/></clipPath>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.18"/></filter>

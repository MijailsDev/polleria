<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="880" viewBox="0 0 1260 880">
  <defs>
    <style>
      text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h1 { font-size: 26px; font-weight: 700; }
      .h2 { font-size: 14px; fill: #475569; }
      .w { fill: #ffffff; }
      .nav { font-size: 13.5px; font-weight: 600; fill: #cbd5e1; }
      .ct { font-size: 14px; font-weight: 700; }
      .kl { font-size: 12.5px; font-weight: 600; fill: #64748b; }
      .kv { font-size: 26px; font-weight: 800; }

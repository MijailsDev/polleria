        <text x="248" y="551" class="rk">1/8 Pollo a la brasa</text><rect x="420" y="540" width="218.8" height="14" rx="4" fill="#2a78d6"/><rect x="420" y="540" width="6" height="14" fill="#2a78d6"/><text x="646.8" y="551" class="rkv">35</text>
        <text x="248" y="575" class="rk">1/2 Pollo a la brasa</text><rect x="420" y="564" width="112.5" height="14" rx="4" fill="#2a78d6"/><rect x="420" y="564" width="6" height="14" fill="#2a78d6"/><text x="540.5" y="575" class="rkv">18</text>

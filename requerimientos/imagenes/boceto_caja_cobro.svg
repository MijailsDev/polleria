<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="880" viewBox="0 0 1260 880">
  <defs>
    <style>
      text { font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .h1 { font-size: 26px; font-weight: 700; }
      .h2 { font-size: 14px; fill: #475569; }
      .w { fill: #ffffff; }
      .s { font-size: 12px; fill: #64748b; }
      .r { font-size: 14px; }
      .rb { font-size: 14px; font-weight: 700; }
      .tag { font-size: 11px; font-weight: 700; letter-spacing: 0.5px; fill: #64748b; }
      .sec { font-size: 13px; font-weight: 700; fill: #334155; }
      .btn { font-size: 13.5px; font-weight: 700; fill: #334155; }
      .nav { font-size: 13px; font-weight: 600; fill: #94a3b8; }
    </style>
    <clipPath id="scr"><rect width="1128" height="620" rx="8"/></clipPath>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.20"/></filter>
  </defs>

  <rect width="1260" height="880" fill="#ffffff"/>
  <text x="50" y="50" class="h1">Boceto: punto de venta en caja · cobro de una mesa</text>
  <text x="50" y="76" class="h2">F-08 y F-10 · pago mixto (efectivo + Yape), cálculo de vuelto, boleta con DNI autocompletado y entrega del comprobante</text>

  <!-- Monitor -->
  <rect x="590" y="752" width="80" height="50" fill="#9ca3af"/>
  <rect x="490" y="798" width="280" height="14" rx="7" fill="#6b7280"/>
  <rect x="50" y="100" width="1160" height="652" rx="20" fill="#111827" filter="url(#sh)"/>

  <g transform="translate(66,116)">
    <rect width="1128" height="620" rx="8" fill="#f1f5f9"/>
    <g clip-path="url(#scr)">
      <!-- Top bar -->
      <rect width="1128" height="54" fill="#1e293b"/>
      <text x="20" y="34" class="w" style="font-size:18px;font-weight:700">Caja 1</text>
      <text x="104" y="33" class="nav">Salón</text>
      <rect x="160" y="13" width="82" height="28" rx="14" fill="#c2410c"/><text x="201" y="32" text-anchor="middle" class="w" style="font-size:13px;font-weight:700">Cobrar</text>
      <text x="262" y="33" class="nav">Llevar / Delivery</text>
      <text x="392" y="33" class="nav">Agotados</text>
      <text x="476" y="33" class="nav">Turno</text>
      <rect x="690" y="13" width="146" height="28" rx="14" fill="#334155"/><circle cx="706" cy="27" r="5" fill="#22c55e"/>
      <text x="718" y="32" class="w" style="font-size:12px;font-weight:600">Impresora pollero</text>
      <rect x="846" y="13" width="96" height="28" rx="14" fill="#dcfce7"/><circle cx="862" cy="27" r="5" fill="#16a34a"/>
      <text x="874" y="32" style="font-size:12px;font-weight:700;fill:#166534">En línea</text>
      <text x="1108" y="26" text-anchor="end" class="w" style="font-size:13px;font-weight:700">Rosa · Cajera</text>
      <text x="1108" y="43" text-anchor="end" style="font-size:11px;fill:#94a3b8">Turno abierto 12:02</text>

      <!-- Cuenta -->
      <rect x="16" y="70" width="540" height="534" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="36" y="104" style="font-size:20px;font-weight:800">Cuenta · Mesa M-02</text>
      <text x="36" y="126" class="s">Mozo Juan · 4 comensales · abierta 19:20</text>

      <text x="36" y="160" class="tag">RONDA 1 · 19:20</text>
      <text x="36" y="186" class="rb">1</text><text x="58" y="186" class="r">1/2 Pollo a la brasa</text><text x="536" y="186" text-anchor="end" class="r">47.00</text>
      <text x="58" y="205" class="s">2 pechos (+S/ 2.00) · papas bien doradas</text>
      <text x="36" y="234" class="rb">1</text><text x="58" y="234" class="r">Gaseosa 1.5 L</text><text x="536" y="234" text-anchor="end" class="r">12.00</text>
      <text x="36" y="268" class="tag">RONDA 2 · 19:41</text>
      <text x="36" y="294" class="rb">1</text><text x="58" y="294" class="r">Porción de papas fritas</text><text x="536" y="294" text-anchor="end" class="r">12.00</text>

      <path d="M36 326 H536" stroke="#e2e8f0"/>
      <text x="36" y="354" class="s" style="font-size:13px">Op. gravada</text><text x="536" y="354" text-anchor="end" class="s" style="font-size:13px">64.25</text>
      <text x="36" y="378" class="s" style="font-size:13px">IGV + IPM (10.5 %)</text><text x="536" y="378" text-anchor="end" class="s" style="font-size:13px">6.75</text>
      <text x="36" y="420" style="font-size:20px;font-weight:800">Total</text>
      <text x="536" y="422" text-anchor="end" style="font-size:28px;font-weight:800">S/ 71.00</text>

      <rect x="36" y="446" width="160" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="116" y="476" text-anchor="middle" class="btn">Dividir cuenta</text>
      <rect x="206" y="446" width="160" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="286" y="476" text-anchor="middle" class="btn">Imprimir precuenta</text>
      <rect x="376" y="446" width="160" height="50" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="456" y="476" text-anchor="middle" class="btn">Descuento (PIN)</text>

      <rect x="36" y="514" width="500" height="72" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="5 4"/>
      <text x="52" y="538" class="sec">Dividir cuenta</text><text x="152" y="538" class="s">cada parte tendrá su propio pago y comprobante</text>
      <rect x="52" y="550" width="100" height="26" rx="13" fill="#e2e8f0"/><text x="102" y="568" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#334155">Por ítems</text>
      <rect x="160" y="550" width="122" height="26" rx="13" fill="#e2e8f0"/><text x="221" y="568" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#334155">Partes iguales</text>
      <rect x="290" y="550" width="108" height="26" rx="13" fill="#e2e8f0"/><text x="344" y="568" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#334155">Por montos</text>

      <!-- Cobro -->
      <rect x="572" y="70" width="540" height="534" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
      <text x="592" y="104" style="font-size:20px;font-weight:800">Cobro</text>
      <rect x="902" y="84" width="190" height="30" rx="15" fill="#dcfce7"/>
      <text x="997" y="104" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#166534">Saldo pendiente S/ 0.00</text>

      <g transform="translate(592,124)">
        <rect width="118" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="59" y="32" text-anchor="middle" class="btn">Efectivo</text>
        <rect x="126" width="118" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="185" y="32" text-anchor="middle" class="btn">Yape</text>
        <rect x="252" width="118" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="311" y="32" text-anchor="middle" class="btn">Plin</text>
        <rect x="378" width="122" height="52" rx="12" fill="#ffffff" stroke="#cbd5e1"/><text x="439" y="32" text-anchor="middle" class="btn">Tarjeta (POS)</text>
      </g>

      <g transform="translate(592,192)">
        <rect width="500" height="64" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="16" y="27" class="rb">Efectivo</text>
        <text x="16" y="48" class="s">Recibido S/ 50.00 · vuelto S/ 20.00 · abre la gaveta</text>
        <text x="448" y="38" text-anchor="end" style="font-size:17px;font-weight:800">S/ 30.00</text>
        <path d="M472 26 l10 10 M482 26 l-10 10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      </g>
      <g transform="translate(592,264)">
        <rect width="500" height="64" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
        <text x="16" y="27" class="rb">Yape</text>
        <text x="16" y="48" class="s">N.° de operación 0482 7713 · único en el sistema</text>
        <text x="448" y="38" text-anchor="end" style="font-size:17px;font-weight:800">S/ 41.00</text>
        <path d="M472 26 l10 10 M482 26 l-10 10" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      </g>

      <text x="592" y="358" class="sec">Comprobante</text>
      <rect x="592" y="368" width="500" height="38" rx="12" fill="#f1f5f9"/>
      <rect x="596" y="372" width="244" height="30" rx="9" fill="#ffffff" stroke="#c2410c"/>
      <text x="718" y="392" text-anchor="middle" style="font-size:13px;font-weight:700;fill:#c2410c">Boleta</text>
      <text x="966" y="392" text-anchor="middle" style="font-size:13px;font-weight:600;fill:#475569">Factura (RUC)</text>

      <rect x="592" y="416" width="500" height="44" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="608" y="443" class="s" style="font-size:12.5px">DNI</text>
      <text x="640" y="443" class="rb">72345678</text>
      <path d="M736 424 v28" stroke="#e2e8f0"/>
      <circle cx="756" cy="438" r="8" fill="#16a34a"/><path d="M752 438 l3 3 l5 -6" stroke="#fff" stroke-width="1.8" fill="none"/>
      <text x="772" y="443" style="font-size:13px;font-weight:600">PÉREZ QUISPE, JUAN</text>
      <text x="1080" y="443" text-anchor="end" class="s">autocompletado</text>

      <text x="592" y="486" class="sec">Entregar por</text>
      <rect x="690" y="470" width="96" height="26" rx="13" fill="#c2410c"/><text x="738" y="488" text-anchor="middle" class="w" style="font-size:12px;font-weight:700">Imprimir</text>
      <rect x="794" y="470" width="104" height="26" rx="13" fill="#e2e8f0"/><text x="846" y="488" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#334155">WhatsApp</text>
      <rect x="906" y="470" width="86" height="26" rx="13" fill="#e2e8f0"/><text x="949" y="488" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#334155">Correo</text>

      <rect x="592" y="520" width="500" height="64" rx="16" fill="#15803d"/>
      <text x="842" y="550" text-anchor="middle" class="w" style="font-size:17px;font-weight:800">Cobrar S/ 71.00 y emitir boleta</text>
      <text x="842" y="570" text-anchor="middle" style="font-size:12px;fill:#bbf7d0">B001-000246 · se envía al OSE y la mesa pasa a «Por limpiar»</text>
    </g>
  </g>

  <text x="630" y="852" text-anchor="middle" style="font-size:15px;font-weight:600;fill:#334155">El botón de cobro solo se habilita cuando el saldo pendiente es S/ 0.00; la gaveta se abre únicamente si hubo efectivo</text>
</svg>
